name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: build, unit tests, smoke, latency
        shell: bash
        run: |
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          rustc -O -o tok-bin$EXE tok.rs
          rustc --test -o tok-unittests$EXE tok.rs
          ./tok-unittests$EXE
          ./tok-bin$EXE --version
          echo '{"tool_name":"Bash","tool_input":{"command":"git status"}}' \
            | ./tok-bin$EXE hook claude | grep -q updatedInput
          ./tok-bin$EXE run -- git --version
          start=$(date +%s%N)
          for i in $(seq 20); do ./tok-bin$EXE --version >/dev/null; done
          end=$(date +%s%N)
          echo "startup avg: $(( (end-start)/20/1000000 )) ms"
      - uses: actions/upload-artifact@v4
        with:
          name: tok-${{ matrix.os }}
          path: tok-bin*

  python-fallback:
    name: python fallback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: smoke
        shell: bash
        run: |
          sed -i.bak '1s|.*|#!/usr/bin/env python3|' tok.py
          python3 tok.py --version
          python3 tok.py run -- git --version
